name: Build and Release SPT Mod

on:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Extract mod metadata
        id: extract
        run: |
          # Extract simple string init properties
          MODGUID=$(grep -rPho -h 'ModGuid\s*{\s*init;\s*}\s*=\s*"\K[^"]+' . --include \*.cs | head -n 1)
          MOD_NAME=$(grep -rPho -h 'Name\s*{\s*init;\s*}\s*=\s*"\K[^"]+' . --include \*.cs | head -n 1)
          AUTHOR=$(grep -rPho -h 'Author\s*{\s*init;\s*}\s*=\s*"\K[^"]+' . --include \*.cs | head -n 1)

          # Extract Version from csproj (still authoritative)
          VERSION=$(grep -rPo '<Version>(.*?)</Version>' **/*.csproj | sed -E 's/.*>(.*)<.*/\1/' | head -n 1)

          echo "Extracted values:"
          echo "ModGuid: $MODGUID"
          echo "Name: $MOD_NAME"
          echo "Author: $AUTHOR"
          echo "Version: $VERSION"

          if [ -z "$MOD_NAME" ] || [ -z "$AUTHOR" ] || [ -z "$VERSION" ]; then
            echo "Missing metadata — failing early" && exit 1
          fi

          echo "MODGUID=$MODGUID" >> $GITHUB_ENV
          echo "MOD_NAME=$MOD_NAME" >> $GITHUB_ENV
          echo "AUTHOR=$AUTHOR" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Project
        run: dotnet build -c Release

      - name: Package mod folder
        run: |
          OUTDIR=$(find . -type d -path "*/bin/Release*" | head -n 1)
          if [ -z "$OUTDIR" ]; then
            echo "No Release output folder found" && exit 1
          fi

          INNER=$(find "$OUTDIR" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          TARGET="package/SPT/user/mods/$AUTHOR-$MOD_NAME"

          echo "Packaging mod into $TARGET"
          mkdir -p "$TARGET"

          rsync -av \
            --exclude "*$MOD_NAME.deps.json" \
            --exclude "*$MOD_NAME.pdb" \
            --exclude "*$MOD_NAME.staticwebassets.endpoints.json" \
            "$INNER"/ "$TARGET/"

          # Updated: Resources folder
          RESOURCES=$(find . -type d -name "Resources" | head -n 1)
          if [ -n "$RESOURCES" ]; then
            echo "Found Resources/, adding bundles/, bundles.json, db/"
          
            # bundles/
            if [ -d "$RESOURCES/bundles" ]; then
              rsync -av "$RESOURCES/bundles/" "$TARGET/bundles/"
            fi

            # bundles.json
            if [ -f "$RESOURCES/bundles.json" ]; then
              rsync -av "$RESOURCES/bundles.json" "$TARGET/"
            fi

            # db/
            if [ -d "$RESOURCES/db" ]; then
              rsync -av "$RESOURCES/db/" "$TARGET/db/"
            fi
          fi

      - name: Zip mod folder
        run: |
          mkdir -p package
          cd package
          zip -r "${AUTHOR}-${MOD_NAME}_v${VERSION}.zip" SPT

      - name: Upload zipped mod
        uses: actions/upload-artifact@v4
        with:
          name: mod_package
          path: package/${{ env.AUTHOR }}-${{ env.MOD_NAME }}_v${{ env.VERSION }}.zip

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download mod artifact
        uses: actions/download-artifact@v4

      - name: Extract tag name from zip
        run: |
          ZIPFILE=$(basename mod_package/*.zip)
          TAGNAME=$(echo "$ZIPFILE" | grep -oP '_v\K[0-9]+\.[0-9]+\.[0-9]+')
          echo "ZIPNAME=$ZIPFILE" >> $GITHUB_ENV
          echo "TAGNAME=v$TAGNAME" >> $GITHUB_ENV

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: mod_package/*.zip
          tag_name: "${{ env.TAGNAME }}"
          name: "${{ env.ZIPNAME }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
