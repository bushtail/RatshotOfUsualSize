name: Build and Release SPT Mod

on:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Extract mod metadata
        id: extract
        run: |
          # Extract init-only string properties
          MODGUID=$(grep -rPho -h 'ModGuid\s*{\s*[^}]*}\s*=\s*"\K[^"]+' . --include \*.cs | head -n 1)
          MOD_NAME=$(grep -rPho -h 'Name\s*{\s*[^}]*}\s*=\s*"\K[^"]+' . --include \*.cs | head -n 1)
          AUTHOR=$(grep -rPho -h 'Author\s*{\s*[^}]*}\s*=\s*"\K[^"]+' . --include \*.cs | head -n 1)

          # Extract Version from csproj
          VERSION=$(grep -rPo '<Version>(.*?)</Version>' **/*.csproj | sed -E 's/.*>(.*)<.*/\1/' | head -n 1)

          echo "Extracted values:"
          echo "ModGuid: $MODGUID"
          echo "Name: $MOD_NAME"
          echo "Author: $AUTHOR"
          echo "Version: $VERSION"

          if [ -z "$MOD_NAME" ] || [ -z "$AUTHOR" ] || [ -z "$VERSION" ]; then
            echo "Missing metadata — failing early" && exit 1
          fi

          echo "MODGUID=$MODGUID" >> $GITHUB_ENV
          echo "MOD_NAME=$MOD_NAME" >> $GITHUB_ENV
          echo "AUTHOR=$AUTHOR" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Project
        run: dotnet build -c Release

      - name: Package mod folder
        run: |
          OUTDIR=$(find . -type d -path "*/bin/Release*" | head -n 1)
          if [ -z "$OUTDIR" ]; then
            echo "No Release output folder found" && exit 1
          fi

          # Find SP1_Runtime folder produced by the build
          RUNTIME=$(find "$OUTDIR" -type d -name "SP1_Runtime" | head -n 1)
          if [ -z "$RUNTIME" ]; then
            echo "SP1_Runtime folder not found in build output" && exit 1
          fi

          TARGET="package/SPT_Runtime/user/mods/$AUTHOR-$MOD_NAME"
          echo "Packaging mod into $TARGET"

          mkdir -p "$TARGET"

          # Copy ONLY the required mod files
          rsync -av "$RUNTIME/bundles/" "$TARGET/bundles/"
          rsync -av "$RUNTIME/bundles.json" "$TARGET/"
          rsync -av "$RUNTIME/db/" "$TARGET/db/"
          rsync -av "$RUNTIME/"*.dll "$TARGET/"

      - name: Zip mod folder
        run: |
          mkdir -p package
          cd package
          zip -r "${AUTHOR}-${MOD_NAME}_v${VERSION}.zip" SPT_Runtime

      - name: Upload zipped mod
        uses: actions/upload-artifact@v7
        with:
          name: mod_package
          path: package/${{ env.AUTHOR }}-${{ env.MOD_NAME }}_v${{ env.VERSION }}.zip

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download mod artifact
        uses: actions/download-artifact@v8
        with:
          name: mod_package
          path: mod_package

      - name: Extract tag name from zip
        run: |
          ZIPFILE=$(find mod_package -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIPFILE" ]; then
            echo "No zip file found in mod_package" >&2
            exit 1
          fi

          BASENAME=$(basename "$ZIPFILE")
          TAGNAME=$(echo "$BASENAME" | grep -oP '_v\K[0-9]+\.[0-9]+\.[0-9]+')

          echo "ZIPNAME=$BASENAME" >> $GITHUB_ENV
          echo "TAGNAME=v$TAGNAME" >> $GITHUB_ENV

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: mod_package/*.zip
          tag_name: "${{ env.TAGNAME }}"
          name: "${{ env.ZIPNAME }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
